<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squid Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- NAVBAR -->

      <nav>
        <div class="logo"><img src="s1.png" alt=""></div>

        <ul>
          <li><a href="#">About</a></li>
          <li><a href="#" class="active">Watch now</a></li>
          <li><a href="#">Actors</a></li>
          <li><a href="#">Contact</a></li>
        </ul>

        <div class="menu">
          <i class="fa-solid fa-bars"></i>
        </div>
      </nav>

      <div class="vertical-text">SQUID</div>
      <!-- HERO -->
      <div class="title">
            <img src="s1.png" alt="">
          </div>
      <div class="hero">
        <div class="left">
          
          <br>
          <p class="desc">
            Action / Thriller / Drama Series directed by Dong-hyuk Hwang
            <br />
            Season 1: 9 Episodes
          </p>

          <div class="buttons">
            <a href="#" class="btn1">
              <i class="ri-play-circle-line"></i>
              Play Now
            </a>

            <a target="_blank" href="https://www.youtube.com/watch?v=oqxAJKy0ii4" class="btn2">
              <i class="fa-regular fa-circle-play"></i>
              Watch Trailer
            </a>
          </div>
        </div>

        <div class="right">
          <img src="main.png" alt="" />
        </div>
      </div>

      <!-- SOCIAL -->

      <div class="social">
        <i class="ri-twitter-line"></i>
        <i class="ri-instagram-line"></i>
        <i class="ri-facebook-fill"></i>
      </div>

      <!-- SCROLL -->

      <div class="scroll">SCROLL</div>
      <div class="line"></div>

      <!-- BACKGROUND TEXT -->

      <div class="bg-text">GAME</div>

      <!-- CARDS -->

      <div class="cards">
        <div class="card">
          <img src="s4.jpg" alt="" />
          <div class="play">
            <i class="fa-solid fa-play"></i>
          </div>
        </div>

        <div class="card">
          <img src="s2.jpg" alt="" />
          <div class="play">
            <i class="fa-solid fa-play"></i>
          </div>
        </div>

        <div class="card">
          <img src="s3.jpg" alt="" />
          <div class="play">
            <i class="fa-solid fa-play"></i>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
